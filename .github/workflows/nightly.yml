name: Build YR MO Nightly
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      upstream_commit:
        description: 'Full NVIDIA commit SHA; blank follows main'
        type: string
        default: ''
      force_rebuild:
        description: 'Rebuild and replace release assets'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: yr-mo-nightly
  cancel-in-progress: false
jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.detect.outputs.commit }}
      tag: ${{ steps.detect.outputs.tag }}
      version: ${{ steps.detect.outputs.version }}
      pending: ${{ steps.detect.outputs.pending }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - id: detect
        run: |
          python -m unittest discover -s tests
          python scripts/detect-nightly.py
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_COMMIT: ${{ inputs.upstream_commit }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
  build:
    needs: detect
    if: needs.detect.outputs.pending == 'true'
    uses: ./.github/workflows/build-bridge.yml
    with:
      upstream_commit: ${{ needs.detect.outputs.commit }}
      version: ${{ needs.detect.outputs.version }}
  publish:
    needs: [detect, build]
    permissions:
      contents: write
    uses: ./.github/workflows/publish-release.yml
    with:
      tag: ${{ needs.detect.outputs.tag }}
      upstream_commit: ${{ needs.detect.outputs.commit }}
