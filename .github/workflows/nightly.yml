name: Build YR MO Nightly
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      upstream_commit:
        description: 'Full NVIDIA commit SHA; blank follows main'
        type: string
        default: ''
      force_rebuild:
        description: 'Rebuild and replace release assets'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: yr-mo-nightly
  cancel-in-progress: false
jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.detect.outputs.commit }}
      tag: ${{ steps.detect.outputs.tag }}
      pending: ${{ steps.detect.outputs.pending }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - id: detect
        run: python scripts/detect-nightly.py
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_COMMIT: ${{ inputs.upstream_commit }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
  build:
    needs: detect
    if: needs.detect.outputs.pending == 'true'
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install meson==1.3.2 ninja==1.11.1.1
      - name: Compile matching client and Host, test and package for MO
        shell: pwsh
        env:
          UPSTREAM_COMMIT: ${{ needs.detect.outputs.commit }}
          NIGHTLY_TAG: ${{ needs.detect.outputs.tag }}
        run: |
          $env:NIGHTLY_TAG | Set-Content VERSION -Encoding utf8
          ./scripts/build-from-source.ps1 -UpstreamCommit $env:UPSTREAM_COMMIT
      - uses: actions/upload-artifact@v4
        with:
          name: yr-mo-nightly
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
  publish:
    needs: [detect, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: yr-mo-nightly
          path: assets
      - name: Publish validated Nightly
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.detect.outputs.tag }}
          UPSTREAM_COMMIT: ${{ needs.detect.outputs.commit }}
          RECIPE_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          Path('notes.md').write_text('YR/MO Nightly\n\nNVIDIA commit: '+os.environ['UPSTREAM_COMMIT']+'\nRecipe commit: '+os.environ['RECIPE_COMMIT']+'\n\nx86 d3d9.dll, matching x64 Host, pinned GPLALL backend. Extract to game root. Compilation and diagnostics passed; game validation pending.\n')
          PY
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$RECIPE_COMMIT" --title "$TAG" --notes-file notes.md --prerelease --draft
          fi
          gh release upload "$TAG" assets/* --clobber
          gh release edit "$TAG" --draft=false --prerelease --notes-file notes.md
