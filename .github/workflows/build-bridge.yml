name: Shared bridge build and package
on:
  workflow_call:
    inputs:
      upstream_commit:
        type: string
        default: '418c3a12ef013c64687a01c092e0027b395f91a0'
      version:
        type: string
        default: ''
      backend_artifact:
        type: string
        default: ''
      artifact_name:
        type: string
        default: yr-mo-nightly
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install meson==1.3.2 ninja==1.11.1.1
      - name: Validate packaging and release regressions
        shell: pwsh
        run: |
          python -m unittest discover -s tests
          if ($LASTEXITCODE -ne 0) { throw 'YR regression tests failed' }
          python -m unittest discover -s third_party/l4d2-bridge/tests
          if ($LASTEXITCODE -ne 0) { throw 'Bridge regression tests failed' }
      - uses: actions/download-artifact@v4
        if: inputs.backend_artifact != ''
        with:
          name: ${{ inputs.backend_artifact }}
          path: third_party/l4d2-bridge/.deps/gplall
      - name: Compile matching client and Host, test and package for MO
        shell: pwsh
        env:
          UPSTREAM_COMMIT: ${{ inputs.upstream_commit }}
          PACKAGE_VERSION: ${{ inputs.version }}
          BACKEND_ARTIFACT: ${{ inputs.backend_artifact }}
        run: |
          $version = $env:PACKAGE_VERSION
          if (!$version) {
            $version = python -c "import sys;sys.path.insert(0,'scripts');from pathlib import Path;from importlib import import_module;print(import_module('detect-nightly').source_version(Path('.')))"
            if ($LASTEXITCODE -ne 0) { throw 'Could not determine package version' }
          }
          $version | Set-Content VERSION -Encoding utf8
          $version | Set-Content third_party/l4d2-bridge/VERSION -Encoding ascii
          $parameters = @{ UpstreamCommit = $env:UPSTREAM_COMMIT }
          if ($env:BACKEND_ARTIFACT) {
            $parameters.DxvkDll = 'third_party/l4d2-bridge/.deps/gplall/d3d9.dll'
            $parameters.BackendMetadata = 'third_party/l4d2-bridge/.deps/gplall/source-backend.json'
          }
          ./scripts/build-from-source.ps1 @parameters
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
