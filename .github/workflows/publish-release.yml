name: Shared verified release publication
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      upstream_commit:
        type: string
        required: true
      gplall_commit:
        type: string
        default: ''
      artifact_name:
        type: string
        default: yr-mo-nightly
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: assets
      - name: Verify, replace as draft, download and verify, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          UPSTREAM_COMMIT: ${{ inputs.upstream_commit }}
          GPLALL_COMMIT: ${{ inputs.gplall_commit }}
          RECIPE_COMMIT: ${{ github.sha }}
        run: python scripts/publish-release.py --assets assets
