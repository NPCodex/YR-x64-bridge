name: Latest Remix and GPLALL source Nightly
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Rebuild the current pair of upstream commits
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: yr-dual-source-nightly
  cancel-in-progress: false
jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.detect.outputs.commit }}
      gplall_commit: ${{ steps.detect.outputs.gplall_commit }}
      tag: ${{ steps.detect.outputs.tag }}
      version: ${{ steps.detect.outputs.version }}
      pending: ${{ steps.detect.outputs.pending }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - id: detect
        run: |
          python -m unittest discover -s tests
          python scripts/detect-dual-nightly.py
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
      - uses: actions/upload-artifact@v4
        if: steps.detect.outputs.pending == 'true'
        with:
          name: upstream-source-metadata
          path: nightly-backend.json
          if-no-files-found: error
  backend:
    needs: detect
    if: needs.detect.outputs.pending == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Digger1955/dxvk-gplall
          ref: ${{ needs.detect.outputs.gplall_commit }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: upstream-source-metadata
          path: metadata
      - name: Build upstream GCC SSE2 O3 LTO backend
        run: |
          docker run --rm -v "$PWD:/src" -w /src archlinux:base-devel bash -euc '
            pacman -Sy --noconfirm archlinux-keyring
            pacman -Syu --needed --noconfirm mingw-w64-gcc meson glslang git
            git config --global --add safe.directory /src
            ./package-release.sh nightly build --no-package --64-only
          '
      - name: Validate x64 DLL and record provenance
        run: |
          mkdir -p backend
          cp build/dxvk-nightly/x64/d3d9.dll backend/d3d9.dll
          cp LICENSE backend/DXVK-GPLALL-LICENSE.txt
          python3 - <<'PY'
          import hashlib, json, struct
          from pathlib import Path
          data = Path('backend/d3d9.dll').read_bytes()
          offset = struct.unpack_from('<I', data, 60)[0]
          assert data[:2] == b'MZ' and data[offset:offset+4] == b'PE\0\0'
          assert struct.unpack_from('<H', data, offset+4)[0] == 0x8664
          metadata = json.loads(Path('metadata/nightly-backend.json').read_text())
          metadata['sha256'] = hashlib.sha256(data).hexdigest()
          Path('backend/source-backend.json').write_text(json.dumps(metadata, indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gplall-source-backend
          path: backend/*
          if-no-files-found: error
  build:
    needs: [detect, backend]
    if: needs.detect.outputs.pending == 'true'
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install meson==1.3.2 ninja==1.11.1.1
      - uses: actions/download-artifact@v4
        with:
          name: gplall-source-backend
          path: third_party/l4d2-bridge/.deps/gplall
      - name: Compile matching client and Host, test and package for MO
        shell: pwsh
        env:
          UPSTREAM_COMMIT: ${{ needs.detect.outputs.commit }}
          NIGHTLY_TAG: ${{ needs.detect.outputs.version }}
        run: |
          $env:NIGHTLY_TAG | Set-Content VERSION -Encoding utf8
          $env:NIGHTLY_TAG | Set-Content third_party/l4d2-bridge/VERSION -Encoding ascii
          ./scripts/build-from-source.ps1 -UpstreamCommit $env:UPSTREAM_COMMIT -DxvkDll third_party/l4d2-bridge/.deps/gplall/d3d9.dll
      - uses: actions/upload-artifact@v4
        with:
          name: yr-mo-nightly
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
  publish:
    needs: [detect, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: yr-mo-nightly
          path: assets
      - name: Publish validated Nightly
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.detect.outputs.tag }}
          UPSTREAM_COMMIT: ${{ needs.detect.outputs.commit }}
          GPLALL_COMMIT: ${{ needs.detect.outputs.gplall_commit }}
          RECIPE_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          Path('notes.md').write_text('YR/MO Nightly\n\nNVIDIA commit: '+os.environ['UPSTREAM_COMMIT']+'\nGPLALL commit: '+os.environ['GPLALL_COMMIT']+'\nRecipe commit: '+os.environ['RECIPE_COMMIT']+'\n\nx86 d3d9.dll, matching x64 Host, source-built GPLALL backend. Extract to game root. Compilation and diagnostics passed; game validation pending.\n')
          PY
          flags=()
          if [[ "$TAG" == *-nightly-* ]]; then flags+=(--prerelease); fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$RECIPE_COMMIT" --title "$TAG" --notes-file notes.md "${flags[@]}" --draft
          fi
          gh release upload "$TAG" assets/* --clobber
          gh release edit "$TAG" --draft=false --prerelease=false "${flags[@]}" --notes-file notes.md
