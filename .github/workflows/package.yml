name: Build YR package manually
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install meson==1.3.2 ninja==1.11.1.1
      - name: Package and validate architecture and checksums
        shell: pwsh
        run: |
          $version = python -c "import sys;sys.path.insert(0,'scripts');from pathlib import Path;from importlib import import_module;print(import_module('detect-nightly').source_version(Path('.')))"
          $version | Set-Content VERSION -Encoding utf8
          $version | Set-Content third_party/l4d2-bridge/VERSION -Encoding ascii
          ./scripts/build-from-source.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: YR-MO-DXVK64-Bridge-release
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
